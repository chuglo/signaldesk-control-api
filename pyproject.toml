[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signaldesk-control-api"
version = "0.1.0"
description = "SignalDesk skeleton for signaldesk-control-api"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16,<2",
    "anyio>=4,<5",
    "fastapi>=0.116,<0.117",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "redis>=6.4,<7",
    "signaldesk-contracts==0.1.0",
    "sqlalchemy>=2.0,<3",
    "uvicorn==0.35.0",
    "werkzeug>=3.1,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "testcontainers[postgres]>=4.10,<5",
]

[tool.uv.sources]
signaldesk-contracts = { path = "../signaldesk-contracts" }

[project.scripts]
signaldesk-outbox-publisher = "signaldesk_control_api.outbox_publisher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk_control_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
